<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#092E35">
    <title>Sin conexión | PEZ Sistema</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            background: #092E35;
            color: #ffffff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        img {
            width: 96px;
            height: 96px;
            border-radius: 1rem;
        }

        h1 {
            margin: 1.5rem 0 .5rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 1.5rem;

        }

        button {
            padding: .75rem 1.5rem;
            border: 0;
            border-radius: .5rem;
            background: #26F669;
            color: #092E35;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icon-192.png" alt="PEZ">
        <h1>Sin conexión</h1>
        <p>No hay conexión a internet. Revisá la red y volvé a intentar.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>

</html>
